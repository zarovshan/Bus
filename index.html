<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,sans-serif;background:#f2f2f7;margin:0;padding:12px 12px 90px;color:#1c1c1e}
.nav{display:flex;background:#e5e5ea;border-radius:10px;padding:4px;margin-bottom:12px;gap:3px}

.btn{width:100%;padding:12px;border:0;border-radius:8px;font-size:15px;font-weight:bold;color:#fff;background:#007aff;margin-bottom:6px}
.bg{background:#34c759}.bo{background:#ff9500}.br{background:#ff3b30}.bp{background:#5856d6}.bd{background:#1c1c1e}
.tag{display:inline-flex;align-items:center;gap:6px;background:#e5e5ea;padding:6px 10px;border-radius:6px;margin:3px;font-size:14px}
.kid{background:#fff;padding:12px;border-radius:12px;margin-bottom:10px;border-left:5px solid #ccc}
.kid.in{border-left-color:#34c759;background:#f0fdf4}.kid.out{border-left-color:#007aff;background:#f0f7ff}.kid.abs{border-left-color:#ff3b30;background:#fef2f2}

.clk{background:#007aff15;color:#007aff;padding:8px;border-radius:8px;font-weight:bold;text-align:center;margin-bottom:10px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:#555}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #eee}
.dx{color:#ff3b30;font-weight:bold;padding:2px 6px}
.msg{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;display:none;z-index:999}
.sync{font-size:12px;text-align:center;margin-bottom:8px;color:#34c759;font-weight:bold}
